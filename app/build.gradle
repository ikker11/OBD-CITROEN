plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codegarage.c4diag'
    compileSdk 34

    defaultConfig {
        applicationId "com.codegarage.c4diag"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    signingConfigs {
        fija {
            storeFile file('c4diag.keystore')
            storePassword 'c4diag123'
            keyAlias 'c4diag'
            keyPassword 'c4diag123'
        }
    }

    buildTypes {
        debug { signingConfig signingConfigs.fija }
        release { minifyEnabled false; signingConfig signingConfigs.fija }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}

plugins {
    id 'com.android.application'
}

android {
    namespace 'com.codegarage.c4diag'
    compileSdk 34

    defaultConfig {
        applicationId "com.codegarage.c4diag"
        minSdk 23
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint { abortOnError false }
}
